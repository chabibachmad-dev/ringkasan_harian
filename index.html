<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Insider</title>
    <meta name="description" content="Ringkasan berita dunia & Indonesia setiap hari jam 20:00." />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta id="meta-theme-color" name="theme-color" content="#ffffff" />

    <!-- Dukungan "Add to Home Screen" di iOS/Safari -->
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Insider" />

    <link rel="icon" href="icons/icon-192.png" />

    <!-- Font monospace ala e-ink/"paper" (mengikuti gaya Snail OS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Layar 1: daftar tanggal, mirip daftar chat WhatsApp -->
      <section id="screen-list" class="screen">
        <header class="topbar">
          <h1 class="brand"><span data-i18n="brand">Daily Insider</span></h1>
          <div class="topbar-actions">
            <button id="notify-toggle" class="icon-btn" title="Notifikasi" aria-label="Notifikasi">
              <span id="notify-icon"></span>
            </button>
            <button id="lang-toggle" class="icon-btn" title="Ganti bahasa / Switch language" aria-label="Ganti bahasa">
              <span id="lang-label">ID</span>
            </button>
            <button id="theme-toggle" class="icon-btn" title="Ganti tema" aria-label="Ganti tema">
              <span id="theme-icon"></span>
            </button>
          </div>
        </header>

        <main class="content">
          <div class="search-bar">
            <input
              id="chat-search-input"
              type="search"
              autocomplete="off"
              data-i18n-placeholder="search_placeholder"
              placeholder="Cari tanggal atau topik…"
            />
          </div>

          <section class="chat-list-section">
            <div id="chat-list" class="chat-list"></div>
            <div id="chat-list-status" class="status-text" hidden></div>
          </section>
        </main>

        <footer class="footer">
          <p data-i18n="footer_note">
            Dibuat otomatis tiap hari jam 20:00 WITA dari berbagai sumber berita publik.
          </p>
        </footer>

        <button type="button" id="new-chat-fab" class="fab" title="Obrolan baru" aria-label="Obrolan baru">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </section>

      <!-- Layar 2: detail satu tanggal -- ringkasan berita tampil sebagai pesan pertama di obrolan -->
      <section id="screen-detail" class="screen" hidden>
        <header class="topbar detail-topbar">
          <button id="back-btn" class="icon-btn" title="Kembali" aria-label="Kembali">←</button>
          <h1 id="detail-date-title" class="detail-title"></h1>
        </header>

        <main class="content">
          <section id="chat-section" class="chat-card">
            <div id="chat-messages" class="chat-messages">
              <div id="chat-summary-slot"></div>
              <div id="chat-thread"></div>
            </div>
          </section>
        </main>

        <div id="chat-input-bar" class="chat-input-bar">
          <div id="chat-status" class="status-text" hidden></div>

          <div id="chat-locked-bar" class="chat-locked-bar" hidden>
            <button type="button" id="chat-unlock-btn" class="chat-unlock-btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="11" width="16" height="9" rx="1.5"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </svg>
              <span data-i18n="chat_unlock_btn">Buka Diskusi</span>
            </button>
          </div>

          <form id="chat-form" class="chat-form" hidden>
            <textarea id="chat-input" rows="1"></textarea>
            <button type="submit" id="chat-send-btn" class="chat-send-btn" aria-label="Kirim" title="Kirim">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M2 21l21-9L2 3v7l15 2-15 2z"></path>
              </svg>
            </button>
          </form>
        </div>

        <button
          type="button"
          id="scroll-bottom-btn"
          class="scroll-bottom-btn"
          title="Ke pesan terbaru"
          aria-label="Ke pesan terbaru"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12l7 7 7-7"></path>
          </svg>
        </button>
      </section>

      <!-- Popup kode akses -->
      <dialog id="chat-code-dialog" class="chat-code-dialog">
        <form id="chat-code-form" class="chat-code-form-modal">
          <h2 data-i18n="chat_code_title">Kode Akses</h2>
          <p id="chat-locked-text" data-i18n="chat_code_prompt">
            Fitur ini pribadi. Masukkan kode akses untuk membukanya.
          </p>
          <input id="chat-code-input" type="password" inputmode="numeric" autocomplete="off" />
          <p id="chat-code-error" class="chat-code-error" hidden></p>
          <div class="chat-code-dialog-actions">
            <button type="button" id="chat-code-cancel" class="secondary-btn" data-i18n="chat_code_cancel">Batal</button>
            <button type="submit" class="primary-btn" data-i18n="chat_code_submit">Buka</button>
          </div>
        </form>
      </dialog>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
