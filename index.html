<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Insider</title>
    <meta name="description" content="Ringkasan berita dunia & Indonesia setiap hari jam 20:00." />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4338ca" />

    <!-- Dukungan "Add to Home Screen" di iOS/Safari -->
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Insider" />

    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Layar 1: daftar tanggal, mirip daftar chat WhatsApp -->
      <section id="screen-list" class="screen">
        <header class="topbar">
          <h1 class="brand">📰 <span data-i18n="brand">Daily Insider</span></h1>
          <div class="topbar-actions">
            <button id="notify-toggle" class="icon-btn" title="Notifikasi" aria-label="Notifikasi">
              <span id="notify-icon">🔕</span>
            </button>
            <button id="lang-toggle" class="icon-btn" title="Ganti bahasa / Switch language" aria-label="Ganti bahasa">
              <span id="lang-label">ID</span>
            </button>
            <button id="theme-toggle" class="icon-btn" title="Ganti tema" aria-label="Ganti tema">
              <span id="theme-icon">🌙</span>
            </button>
          </div>
        </header>

        <main class="content">
          <div class="search-bar">
            <input
              id="chat-search-input"
              type="search"
              autocomplete="off"
              data-i18n-placeholder="search_placeholder"
              placeholder="Cari tanggal atau topik…"
            />
          </div>

          <section class="chat-list-section">
            <div id="chat-list" class="chat-list"></div>
            <div id="chat-list-status" class="status-text" hidden></div>
          </section>
        </main>

        <footer class="footer">
          <p data-i18n="footer_note">
            Dibuat otomatis tiap hari jam 20:00 WITA dari berbagai sumber berita publik.
          </p>
        </footer>
      </section>

      <!-- Layar 2: detail satu tanggal -- ringkasan berita tampil sebagai pesan pertama di obrolan -->
      <section id="screen-detail" class="screen" hidden>
        <header class="topbar detail-topbar">
          <button id="back-btn" class="icon-btn" title="Kembali" aria-label="Kembali">←</button>
          <h1 id="detail-date-title" class="detail-title"></h1>
        </header>

        <main class="content">
          <section id="chat-section" class="chat-card">
            <div id="chat-messages" class="chat-messages">
              <div id="chat-summary-slot"></div>
              <div id="chat-thread"></div>
            </div>

            <div id="chat-locked" class="chat-locked" hidden>
              <p id="chat-locked-text" data-i18n="chat_code_prompt">
                Fitur ini pribadi. Masukkan kode akses untuk membukanya.
              </p>
              <form id="chat-code-form" class="chat-code-form">
                <input
                  id="chat-code-input"
                  type="password"
                  inputmode="numeric"
                  autocomplete="off"
                  data-i18n-placeholder="chat_code_placeholder"
                  placeholder="Kode akses"
                />
                <button type="submit" class="primary-btn" data-i18n="chat_code_submit">Buka</button>
              </form>
              <p id="chat-code-error" class="chat-code-error" hidden></p>
            </div>

            <div id="chat-body" class="chat-body" hidden>
              <div id="chat-status" class="status-text" hidden></div>
              <form id="chat-form" class="chat-form">
                <textarea
                  id="chat-input"
                  rows="1"
                  data-i18n-placeholder="chat_placeholder"
                  placeholder="Tulis pertanyaan atau ajak diskusi…"
                ></textarea>
                <button type="submit" id="chat-send-btn" class="primary-btn" data-i18n="chat_send">Kirim</button>
              </form>
            </div>
          </section>
        </main>
      </section>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
