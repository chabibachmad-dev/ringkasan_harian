<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1b2f"><title>Laboratorium Kimia - Ayyubi</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff}@media (prefers-color-scheme:dark){body{background:#111116}}</style></head><body><div id="app"></div><script>(()=>{var je={H2O:["Minum, memasak, mencuci, mengairi sawah, dan memutar turbin pembangkit listrik tenaga air.","Drinking, cooking, washing, irrigating rice fields and turning hydroelectric turbines."],H2O2:["Antiseptik luka ringan (yang sangat encer), pemutih kain, dan pemutih rambut.","A mild wound antiseptic (very dilute), fabric bleach and hair bleach."],CO2:["Gelembung pada minuman bersoda, pemadam api, es kering sebagai pendingin, dan bahan fotosintesis tumbuhan.","Bubbles in fizzy drinks, fire extinguishers, dry ice for cooling, and the raw material of plant photosynthesis."],CO:["Di pabrik dipakai untuk mengolah bijih besi menjadi besi. Di rumah justru perlu dihindari: jangan menyalakan mesin di ruang tertutup.","Factories use it to turn iron ore into iron. At home it must be avoided: never run an engine in a closed room."],CH4:["Gas alam untuk kompor dan pembangkit listrik, serta biogas dari kotoran ternak.","Natural gas for stoves and power plants, and biogas made from animal manure."],C3H8:["Elpiji untuk kompor dan pemanas, juga isi pemantik besar.","LPG for stoves and heaters, also the fuel in large lighters."],C2H4:["Mempercepat pematangan buah dan menjadi bahan dasar plastik polietilena (kantong plastik).","Speeds up fruit ripening and is the raw material of polyethylene plastic (plastic bags)."],C2H5OH:["Pembersih tangan, bahan bakar bioetanol, dan pelarut parfum serta obat.","Hand sanitizer, bioethanol fuel, and a solvent for perfume and medicine."],CH3COOH:["Cuka dapur untuk masakan dan acar, juga pembersih kerak teko.","Kitchen vinegar for cooking and pickles, also a kettle descaler."],H2CO3:["Rasa 'menyengat' pada minuman bersoda dan air mineral berkarbonasi.","The 'tingle' in fizzy drinks and sparkling mineral water."],C6H12O6:["Cairan infus di rumah sakit, sumber energi otot dan otak, dan pemanis permen.","Hospital drips, an energy source for muscles and brain, and a candy sweetener."],C12H22O11:["Pemanis kue dan minuman, serta pengawet selai.","Sweetener for cakes and drinks, and a preservative in jam."],NH3:["Bahan pembuat pupuk urea dan ZA, pembersih kaca (yang sangat encer), dan pendingin industri.","Raw material for urea and ammonium sulfate fertilizer, (very dilute) glass cleaner, and industrial coolant."],NaCl:["Bumbu masak, pengawet ikan asin, dan bahan pembuat klor serta soda api di pabrik.","Seasoning, preservative for salted fish, and the starting material for chlorine and caustic soda."],NaOH:["Pembuat sabun batang dan kertas di pabrik. Soda api tidak boleh disentuh langsung.","Used in factories to make bar soap and paper. Never touch caustic soda directly."],HCl:["Pembersih kerak toilet (yang encer), pengolah logam di pabrik, dan sumber asam lambung (sangat encer).","Diluted toilet descaler, metal processing in factories, and the acid in our stomach (very dilute)."],H2SO4:["Cairan aki mobil dan motor, pembuatan pupuk, dan deterjen.","Car and motorbike battery acid, fertilizer production, and detergents."],HNO3:["Pembuatan pupuk dan pengolah logam di industri. Tidak boleh disentuh.","Used in fertilizer production and metal processing. Never touch it."],H3PO4:["Pupuk, penyedap asam pada minuman cola, dan pembersih karat.","Fertilizer, the tangy flavour in cola drinks, and a rust remover."],H2S:["Dikenal dari bau telur busuk, sumber air panas belerang, dan selokan; di industri diolah menjadi belerang.","Known from the smell of rotten eggs, sulfur hot springs and sewers; industry turns it into sulfur."],SO2:["Pengawet buah kering dalam takaran kecil, pemutih kertas, dan bahan pembuat asam sulfat.","A small amount preserves dried fruit; also a paper bleach and the starting material for sulfuric acid."],CaCO3:["Bahan semen, pasta gigi, tablet kalsium, dan penyusun kulit telur serta kerang.","Raw material for cement, toothpaste, calcium tablets, and the stuff of eggshells and seashells."],CaO:["Bahan semen dan penjernih air. Kapur tohor bereaksi panas dengan air.","Cement ingredient and water purifier. Quicklime heats up strongly with water."],"Ca(OH)2":["Kapur sirih, pengapur dinding dan batang pohon, dan penetral tanah yang terlalu asam.","Betel-chew lime, whitewash for walls and tree trunks, and a neutralizer for acidic soil."],MgO:["Lapisan bata tahan api di tungku, dan bahan pupuk serta obat maag tertentu.","Heat-proof furnace bricks, and an ingredient of some fertilizers and antacids."],Fe2O3:["Pigmen merah-cokelat pada cat dan batu bata; ia juga yang membentuk karat dan bijih besi hematit.","Red-brown pigment in paint and bricks; it is also rust and the ore hematite."],Fe3O4:["Bijih besi magnetit, bahan tinta cetak, dan serbuk magnet.","The iron ore magnetite, an ingredient of printing ink, and magnet powder."],FeS2:["Bahan baku pembuatan asam sulfat dan petunjuk keberadaan bijih emas; sering dipajang sebagai batu hias.","A raw material for sulfuric acid, a clue to gold ore, and often displayed as a decorative stone."],Al2O3:["Ampelas, kaca arloji safir, busi, dan bahan baku aluminium (dari bijih bauksit).","Sandpaper, sapphire watch glass, spark plugs, and the raw material of aluminium (from bauxite ore)."],SiO2:["Kaca jendela dan gelas, pasir bangunan, dan chip komputer (silikon berasal dari pasir).","Window glass and drinking glasses, building sand, and computer chips (silicon comes from sand)."],TiO2:["Pigmen putih pada cat, kertas, tabir surya, dan pasta gigi.","White pigment in paint, paper, sunscreen and toothpaste."],CuO:["Pewarna kaca dan keramik hijau-biru serta katalis di pabrik.","Colours glass and ceramics blue-green, and is a catalyst in factories."],CuSO4:["Pembasmi jamur kebun (campuran Bordeaux), pewarna, dan penyepuh tembaga.","Garden fungicide (Bordeaux mixture), a dye ingredient, and copper plating."],ZnO:["Tabir surya, bedak, salep kulit, dan campuran karet ban.","Sunscreen, powders, skin ointments and a tyre rubber additive."],AgCl:["Kaca kacamata yang menggelap di bawah sinar matahari dan film foto zaman dulu.","Photochromic glasses that darken in sunlight, and old photographic film."],NaHCO3:["Soda kue pengembang adonan, pembersih dapur, dan penetral asam lambung ringan.","Baking soda that lifts dough, a kitchen cleaner, and a mild antacid."],Na2CO3:["Pembuat kaca dan sabun, serta pelunak air cuci.","Used to make glass and soap and to soften laundry water."],KCl:["Pupuk kalium dan bahan garam rendah natrium.","Potassium fertilizer and an ingredient of low-sodium salt."]},Me={He:["Mengisi balon pesta agar melayang dan pendingin alat MRI.","Fills party balloons so they float and cools MRI machines."],Li:["Baterai ponsel, laptop, dan mobil listrik.","Batteries of phones, laptops and electric cars."],C:["Pensil (grafit), arang, berlian, dan bahan baja.","Pencils (graphite), charcoal, diamonds and an ingredient of steel."],Ne:["Lampu neon reklame berwarna merah-jingga.","Red-orange neon signs."],Mg:["Rangka laptop dan kamera yang ringan, serta kembang api putih terang.","Light laptop and camera frames, and bright white sparklers."],Al:["Kaleng minuman, foil dapur, rangka pesawat, dan panci.","Drink cans, kitchen foil, aircraft frames and pots."],Si:["Chip komputer dan ponsel, serta panel surya.","Computer and phone chips, and solar panels."],P:["Pupuk (dalam bentuk fosfat) dan kepala korek api.","Fertilizer (as phosphates) and matchheads."],S:["Belerang untuk membuat asam sulfat, korek api, dan vulkanisasi karet ban.","Sulfur for sulfuric acid, matches, and vulcanizing tyre rubber."],Ar:["Mengisi bohlam lampu pijar dan gas pelindung saat mengelas.","Fills light bulbs and shields metal during welding."],Ca:["Penyusun tulang dan gigi (dalam bentuk senyawa) serta pembuat paduan logam.","Builds bones and teeth (as compounds) and is used to make alloys."],Ti:["Rangka pesawat, sendi buatan, dan kacamata yang ringan dan kuat.","Aircraft frames, joint implants and light, strong glasses frames."],Cr:["Lapisan krom mengilap pada knalpot, dan campuran baja tahan karat.","Shiny chrome plating and an ingredient of stainless steel."],Fe:["Paku, jembatan, rangka gedung, dan campuran baja.","Nails, bridges, building frames, and the base of steel."],Ni:["Koin, baterai isi ulang, dan campuran baja tahan karat.","Coins, rechargeable batteries and an ingredient of stainless steel."],Cu:["Kabel listrik, pipa air, dan peralatan masak.","Electric wires, water pipes and cookware."],Zn:["Pelapis seng pada atap (seng gelombang) dan casing baterai.","Zinc coating on corrugated roofs and battery casings."],Ag:["Perhiasan, peralatan makan, dan cermin; perak menghantar listrik paling baik.","Jewellery, cutlery and mirrors; silver conducts electricity best of all."],Sn:["Pelapis kaleng makanan dan solder elektronik; Indonesia penghasil timah dari Bangka Belitung.","Coats food cans and makes electronics solder; Indonesia mines tin on the Bangka Belitung islands."],W:["Filamen bohlam pijar karena tahan panas sangat tinggi.","Filaments of incandescent bulbs because it withstands extreme heat."],Pt:["Perhiasan, katalis knalpot mobil, dan alat kesehatan.","Jewellery, car exhaust catalysts and medical tools."],Au:["Perhiasan, kontak elektronik yang tahan karat, dan cadangan kekayaan negara.","Jewellery, corrosion-free electronic contacts and national reserves."],Pb:["Pelat aki dan pelindung radiasi; tidak dipakai lagi pada cat karena beracun.","Battery plates and radiation shielding; no longer used in paint because it is toxic."]},Pe=[["HF","Asam fluorida","Hydrofluoric acid","cair","#e8f4f8","Asam yang dapat melarutkan kaca; sangat berbahaya dan hanya dipakai ahli.","An acid that can dissolve glass; very dangerous and used only by experts.",!0,"Mengukir (etsa) kaca di pabrik dan membuat bahan pendingin serta plastik tertentu.","Etching glass in factories and making some refrigerants and plastics."],["HBr","Hidrogen bromida","Hydrogen bromide","gas","#f1ecd8","Gas tak berwarna yang larut dalam air menjadi asam kuat.","A colourless gas that dissolves in water to make a strong acid.",!0,"Bahan awal pembuatan obat dan zat kimia lain di industri.","A starting material for medicines and other chemicals in industry."],["N2O","Dinitrogen monoksida","Dinitrogen monoxide","gas","#eef0f5","Dikenal sebagai gas gelak; dalam jumlah banyak berbahaya.","Known as laughing gas; dangerous in large amounts.",!1,"Pembius ringan di kedokteran gigi dan pendorong krim kocok dalam kaleng.","A mild anaesthetic in dentistry and the propellant in whipped-cream cans."],["NO","Nitrogen monoksida","Nitrogen monoxide","gas","#e6e3ea","Gas dari mesin kendaraan; tubuh juga membuat sedikit untuk melebarkan pembuluh darah.","A gas from vehicle engines; the body also makes a little to widen blood vessels.",!0,"Bahan awal pembuatan asam nitrat untuk pupuk dan ikut mencemari udara dari knalpot.","A starting material for the nitric acid in fertilizer, and part of exhaust pollution."],["NO2","Nitrogen dioksida","Nitrogen dioxide","gas","#c4743a","Gas cokelat kemerahan berbau tajam; beracun.","A reddish-brown gas with a sharp smell; toxic.",!0,"Penyebab kabut cokelat di kota-kota berpolusi dan perantara pembuatan asam nitrat.","The cause of brown smog over polluted cities and a step in making nitric acid."],["SO3","Belerang trioksida","Sulfur trioxide","cair","#f0f0e8","Bereaksi hebat dengan air menjadi asam sulfat; berbahaya.","Reacts fiercely with water to give sulfuric acid; dangerous.",!0,"Langkah antara pembuatan asam sulfat di pabrik; bila lepas ke udara ikut membuat hujan asam.","A middle step in making sulfuric acid; if released into air it adds to acid rain."],["C2H2","Etuna (asetilena)","Ethyne (acetylene)","gas","#eaeaf2","Gas yang terbakar dengan nyala sangat panas.","A gas that burns with a very hot flame.",!0,"Las dan pemotong logam (las karbit).","Welding and metal cutting torches."],["C2H6","Etana","Ethane","gas","#e3e9ef","Salah satu penyusun gas alam.","One of the components of natural gas.",!1,"Bahan baku pembuatan etena untuk plastik di pabrik.","A raw material for making ethene for plastics."],["C3H6","Propena","Propene","gas","#e9eef3","Gas bahan dasar plastik yang kita pakai sehari-hari.","A gas that is the starting point of everyday plastics.",!1,"Bahan plastik polipropilena: galon, tutup botol, dan kotak makan.","Makes polypropylene plastic: water jugs, bottle caps and lunch boxes."],["C4H10","Butana","Butane","gas","#e3e9ef","Gas yang mudah dicairkan di dalam tabung kecil.","A gas that is easily liquefied in small canisters.",!1,"Isi korek api gas dan kompor portabel.","The fuel inside gas lighters and portable stoves."],["C8H18","Oktana","Octane","cair","#f6edc9","Penyusun bensin; angka oktan menunjukkan mutunya.","A part of petrol; the octane rating shows its quality.",!0,"Bahan bakar kendaraan bermotor.","Fuel for motor vehicles."],["C6H6","Benzena","Benzene","cair","#eef1f4","Cincin enam karbon yang menjadi dasar banyak zat kimia; uapnya beracun.","A ring of six carbons that is the base of many chemicals; its vapour is toxic.",!0,"Bahan awal pembuatan plastik, karet sintetis, dan deterjen di pabrik (tidak dipakai langsung di rumah).","A starting material for plastics, synthetic rubber and detergents in factories (not used directly at home)."],["CH3OH","Metanol","Methanol","cair","#eaf3fa","Alkohol paling sederhana; beracun bila tertelan.","The simplest alcohol; poisonous if swallowed.",!0,"Pelarut, bahan campuran bahan bakar, dan bahan pembuatan biodiesel di industri.","A solvent, a fuel additive and a raw material for biodiesel in industry."],["CH2O","Formaldehida","Formaldehyde","gas","#f1f1f1","Gas berbau tajam; larutannya disebut formalin.","A sharp-smelling gas; its solution is called formalin.",!0,"Mengawetkan spesimen biologi dan membuat lem kayu lapis. Dilarang untuk makanan.","Preserves biological specimens and makes plywood glue. Forbidden in food."],["C3H6O","Aseton","Acetone","cair","#eaf4fb","Pelarut yang menguap cepat dan mudah terbakar.","A fast-evaporating, flammable solvent.",!0,"Penghapus cat kuku dan pelarut cat serta lem.","Nail polish remover and a solvent for paint and glue."],["C3H8O3","Gliserol","Glycerol","cair","#f4f9fc","Cairan kental manis tak berbau.","A thick, sweet liquid without smell.",!1,"Pelembap pada sabun, krim, dan makanan.","A moisturizer in soap, creams and foods."],["C2H6O2","Etilena glikol","Ethylene glycol","cair","#d9f0d0","Cairan manis yang beracun bila tertelan.","A sweet liquid that is poisonous if swallowed.",!0,"Cairan pendingin (antibeku) pada radiator mobil; jauhkan dari anak dan hewan.","Coolant (antifreeze) in car radiators; keep away from children and pets."],["C6H8O7","Asam sitrat","Citric acid","padat","#fffdf0","Asam yang membuat jeruk dan lemon terasa asam.","The acid that makes oranges and lemons sour.",!1,"Penyedap asam pada permen dan minuman, pengawet, serta pembersih kerak teko.","A sour flavour in sweets and drinks, a preservative, and a kettle descaler."],["C6H8O6","Vitamin C (asam askorbat)","Vitamin C (ascorbic acid)","padat","#fff3b8","Vitamin larut air yang dibutuhkan tubuh.","A water-soluble vitamin the body needs.",!1,"Suplemen, serta antioksidan agar buah potong tidak cepat cokelat.","Supplements, and an antioxidant that stops cut fruit going brown."],["C9H8O4","Aspirin","Aspirin","padat","#fcfcfc","Obat yang sudah lama dikenal; pakai hanya atas anjuran dokter atau apoteker.","A long-known medicine; use only on the advice of a doctor or pharmacist.",!1,"Obat pereda nyeri dan penurun demam, serta pengencer darah dosis rendah atas anjuran dokter.","A pain and fever reliever, and a low-dose blood thinner on a doctor's advice."],["C8H10N4O2","Kafein","Caffeine","padat","#f6f3ee","Zat penyegar alami dalam kopi, teh, dan cokelat.","A natural stimulant in coffee, tea and chocolate.",!1,"Ada di kopi, teh, dan minuman energi; anak-anak sebaiknya membatasinya.","Found in coffee, tea and energy drinks; children should limit it."],["C6H5COONa","Natrium benzoat","Sodium benzoate","padat","#fdfdfd","Pengawet yang mencegah tumbuhnya jamur dan bakteri.","A preservative that stops mould and bacteria growing.",!1,"Pengawet saus, sambal botolan, dan minuman dalam batas aman.","A preservative in sauces, bottled chilli sauce and drinks within safe limits."],["C8H9NO2","Parasetamol","Paracetamol","padat","#fafafa","Obat penurun demam; takarannya harus sesuai petunjuk.","A fever medicine; the dose must follow the instructions.",!1,"Obat penurun demam dan pereda nyeri ringan.","Medicine for fever and mild pain."],["C3H6O3","Asam laktat","Lactic acid","cair","#fbf6e6","Asam yang ada pada yogurt dan susu asam.","The acid in yogurt and sour milk.",!1,"Pembuat yogurt, keju, pengawet makanan, dan perawatan kulit.","Used to make yogurt and cheese, to preserve food and in skin care."],["C10H8","Naftalena","Naphthalene","padat","#fbfbfb","Padatan putih berbau tajam; uapnya tidak boleh dihirup lama.","A white solid with a sharp smell; its vapour should not be breathed for long.",!0,"Bola kapur barus pengusir ngengat di lemari; jauhkan dari anak.","Mothballs in wardrobes; keep away from children."],["C10H16O","Kamper","Camphor","padat","#fdfdfa","Padatan putih beraroma khas; tidak untuk ditelan.","A white solid with a typical smell; not to be swallowed.",!0,"Balsem dan minyak angin, serta pengharum lemari.","Balms and medicated oils, and wardrobe freshener."],["C16H32O2","Asam palmitat","Palmitic acid","padat","#fbf5e4","Asam lemak utama dalam minyak sawit.","The main fatty acid in palm oil.",!1,"Bahan sabun, kosmetik, dan margarin; berasal dari minyak sawit.","An ingredient of soap, cosmetics and margarine; it comes from palm oil."],["C18H36O2","Asam stearat","Stearic acid","padat","#fbf5e4","Asam lemak berwujud padat seperti lilin.","A wax-like solid fatty acid.",!1,"Pembuat lilin, sabun, dan krim kosmetik.","Used to make candles, soap and cosmetic creams."],["C18H34O2","Asam oleat","Oleic acid","cair","#f7edc0","Asam lemak utama dalam minyak zaitun.","The main fatty acid in olive oil.",!1,"Penyusun minyak zaitun serta bahan sabun dan kosmetik.","A part of olive oil and an ingredient of soap and cosmetics."],["C17H35COONa","Natrium stearat (sabun)","Sodium stearate (soap)","padat","#f9fcff","Satu ujung molekulnya menyukai air, ujung lainnya menyukai minyak.","One end of the molecule likes water, the other likes oil.",!1,"Sabun batang yang mengangkat minyak dan kotoran dari kulit.","Bar soap that lifts oil and dirt off the skin."],["CH3COONa","Natrium asetat","Sodium acetate","padat","#fdfdfd","Garam dari cuka dan soda; larutan jenuhnya bisa mengkristal dan melepas panas.","A salt from vinegar and soda; a supersaturated solution can crystallize and release heat.",!1,"Penghangat tangan sekali pakai yang bisa dipakai ulang, dan penyedap asam pada keripik.","Reusable hand warmers, and a tangy flavouring on crisps."],["CO(NH2)2","Urea","Urea","padat","#fdfdfd","Zat yang ada dalam air seni; dibuat pabrik dalam jumlah sangat besar.","A substance in urine; factories make it in huge amounts.",!1,"Pupuk urea untuk padi dan jagung.","Urea fertilizer for rice and maize."],["NH4Cl","Amonium klorida","Ammonium chloride","padat","#fdfdfd","Serbuk putih yang ada di dalam baterai kering lama.","A white powder found in old dry batteries.",!1,"Baterai seng-karbon, pupuk, dan campuran pembersih saat menyolder.","Zinc-carbon batteries, fertilizer, and a cleaning flux for soldering."],["(NH4)2SO4","Amonium sulfat","Ammonium sulfate","padat","#fcfcfc","Pupuk yang kaya nitrogen dan belerang.","A fertilizer rich in nitrogen and sulfur.",!1,"Pupuk ZA untuk padi dan tebu.","ZA fertilizer for rice and sugarcane."],["NaClO","Natrium hipoklorit","Sodium hypochlorite","cair","#f2f7d3","Larutan pemutih; tidak boleh dicampur dengan pembersih lain.","The bleach solution; never mix it with other cleaners.",!0,"Pemutih pakaian, pembunuh kuman di kolam renang, dan pembersih lantai.","Laundry bleach, swimming-pool disinfectant and floor cleaner."],["KOH","Kalium hidroksida","Potassium hydroxide","padat","#f2f2f2","Basa kuat yang dipakai membuat sabun cair; berbahaya bagi kulit.","A strong base used for liquid soap; harmful to skin.",!0,"Sabun cair, baterai alkalin, dan pupuk.","Liquid soap, alkaline batteries and fertilizer."],["Mg(OH)2","Magnesium hidroksida","Magnesium hydroxide","padat","#fafafa","Basa lemah berwarna putih.","A weak white base.",!1,"Obat maag (antasida) dan pengolahan limbah asam.","Antacid medicine and treatment of acidic waste water."],["Al(OH)3","Aluminium hidroksida","Aluminium hydroxide","padat","#fcfcfc","Serbuk putih yang larut baik di asam maupun basa kuat.","A white powder that dissolves in both acids and strong bases.",!1,"Obat maag, penjernih air, dan pelindung api pada plastik.","Antacid medicine, water clarifier and flame retardant in plastics."],["Na2SO4","Natrium sulfat","Sodium sulfate","padat","#fcfcfc","Garam putih yang mudah larut dalam air.","A white salt that dissolves easily in water.",!1,"Pengisi deterjen bubuk dan bahan pembuat kertas dan kaca.","A filler in washing powder and an ingredient for paper and glass."],["K2SO4","Kalium sulfat","Potassium sulfate","padat","#fbfbfb","Garam putih sumber kalium dan belerang bagi tanaman.","A white salt that gives plants potassium and sulfur.",!1,"Pupuk untuk buah dan tembakau yang tidak cocok dengan klorida.","Fertilizer for fruit and tobacco, which dislike chloride."],["MgSO4","Magnesium sulfat","Magnesium sulfate","padat","#fdfdfd","Garam Epsom; hablurnya tidak berwarna.","Epsom salt; its crystals are colourless.",!1,"Garam rendam kaki dan pupuk tanaman hias.","Foot-soak salt and fertilizer for ornamental plants."],["CaSO4","Kalsium sulfat","Calcium sulfate","padat","#f6f4ee","Gipsum yang lunak, bisa digores kuku.","Soft gypsum that a fingernail can scratch.",!1,"Papan plafon, gips patah tulang, dan pengeras pada tahu.","Ceiling boards, plaster casts for broken bones and a firming agent in tofu."],["BaSO4","Barium sulfat","Barium sulfate","padat","#fdfdfd","Tidak larut dalam air, jadi tidak seberacun garam barium lain.","It does not dissolve in water, so it is not as poisonous as other barium salts.",!1,"Bubur barium untuk foto rontgen saluran cerna dan pigmen putih cat.","The 'barium meal' for gut X-rays and a white pigment in paint."],["ZnSO4","Seng sulfat","Zinc sulfate","padat","#fbfbfb","Garam seng yang larut dalam air.","A zinc salt that dissolves in water.",!1,"Pupuk mikro seng dan bahan suplemen seng.","Zinc micronutrient fertilizer and an ingredient of zinc supplements."],["FeSO4","Besi(II) sulfat","Iron(II) sulfate","padat","#9ad7a0","Hablur hijau pucat sumber zat besi.","Pale-green crystals that supply iron.",!1,"Tablet tambah darah dan pupuk untuk daun tanaman yang menguning.","Iron tablets and fertilizer for plants with yellowing leaves."],["Al2(SO4)3","Aluminium sulfat","Aluminium sulfate","padat","#fdfdfd","Garam putih yang membuat kotoran dalam air menggumpal.","A white salt that makes dirt in water clump together.",!1,"Penjernih air keruh di instalasi air minum.","Clears muddy water at drinking-water plants."],["KAl(SO4)2","Tawas (kalium aluminium sulfat)","Alum (potassium aluminium sulfate)","padat","#f9fdff","Hablur bening seperti kaca yang mudah tumbuh besar.","Clear glassy crystals that grow large easily.",!1,"Penjernih air keruh dan batu tawas deodoran.","Clears muddy water and makes deodorant stones."],["AgNO3","Perak nitrat","Silver nitrate","padat","#fbfbfb","Meninggalkan noda hitam pada kulit.","Leaves black stains on skin.",!0,"Pelapis perak, cermin, dan film foto zaman dulu.","Silve .lk{--lk-bg:#fff;--lk-fg:#16161d;--lk-mut:#5d6075;--lk-line:#16161d;--lk-card:#f1f2f7;--lk-ink:#1b1b2f;--lk-acc:#3b5bdb;--lk-sel:36px;
  color:var(--lk-fg);background:var(--lk-bg);font-family:inherit;box-sizing:border-box;display:flex;flex-direction:column;min-height:100%;position:relative}
html[data-theme="dark"] .lk{--lk-bg:#111116;--lk-fg:#f2f2f6;--lk-mut:#a7aac2;--lk-line:#f2f2f6;--lk-card:#1d1d27;--lk-acc:#91a7ff}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .lk{--lk-bg:#111116;--lk-fg:#f2f2f6;--lk-mut:#a7aac2;--lk-line:#f2f2f6;--lk-card:#1d1d27;--lk-acc:#91a7ff}}
.lk *{box-sizing:border-box}
.lk button{font:inherit;color:inherit;cursor:pointer}
.lk-head{display:flex;align-items:center;gap:10px;padding:10px 16px}
.lk-head h2{margin:0;font-size:17px;flex:1}
.lk-tabs{display:flex;border-bottom:1.5px solid var(--lk-line);margin:0 16px}
.lk-tab{flex:1;background:none;border:0;padding:12px 4px;font-weight:700;font-size:13px;color:var(--lk-mut);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.lk-tab[aria-selected="true"]{color:var(--lk-fg);border-bottom-color:var(--lk-fg)}
.lk-body{padding:12px 16px 28px;flex:1}
.lk-hint{font-size:12px;color:var(--lk-mut);margin:0 0 10px;line-height:1.45}
.lk-bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.lk-btn{border:1.5px solid var(--lk-line);background:none;border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:13px}
.lk-btn.utama{background:var(--lk-fg);color:var(--lk-bg)}
.lk-btn[disabled]{opacity:.4;cursor:default}
.lk-btn.kecil{min-height:36px;padding:0 10px}
.lk-gridwrap{overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.lk-grid{display:grid;grid-template-columns:repeat(18,var(--lk-sel));grid-template-rows:repeat(7,var(--lk-sel)) 10px repeat(2,var(--lk-sel));gap:3px;width:max-content}
.lk-sel,.lk-ph{position:relative;border:0;padding:0;color:#1b1b2f;line-height:1;
  clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px));
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.55),inset -2px -2px 0 rgba(0,0,0,.28)}
.lk button.lk-sel{color:#1b1b2f}
.lk-sel:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #1b1b2f,inset 0 0 0 5px #fff}
.lk-sel:active{transform:translateY(1px)}
.lk-sel .lk-no{position:absolute;left:4px;top:3px;font-size:calc(var(--lk-sel)*.22);opacity:.85}
.lk-sel .lk-sym{display:block;font-weight:800;font-size:calc(var(--lk-sel)*.42);padding-top:calc(var(--lk-sel)*.2)}
.lk-ph{display:grid;place-items:center;font-size:calc(var(--lk-sel)*.2);opacity:.75}
.lk-sel.dim{opacity:.18}
.lk-sel[data-n]::after{content:attr(data-n);position:absolute;right:2px;bottom:1px;background:#1b1b2f;color:#fff;font-size:10px;font-weight:700;padding:1px 3px;border-radius:2px}
.lk-sel[data-n]{box-shadow:inset 0 0 0 3px #1b1b2f,inset 0 0 0 5px #fff}
.lk-leg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lk-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--lk-line);background:none;border-radius:999px;padding:4px 10px;font-size:11px;min-height:32px}
.lk-chip i{width:12px;height:12px;display:inline-block;border:1.5px solid #1b1b2f}
.lk-chip[aria-pressed="true"]{background:var(--lk-fg);color:var(--lk-bg)}
.lk-search{width:100%;border:1.5px solid var(--lk-line);border-radius:12px;min-height:44px;padding:0 12px;background:none;color:inherit;font:inherit;margin:4px 0 8px}
.lk h3{margin:14px 0 6px;font-size:14px}
.lk-meja{border:1.5px dashed var(--lk-line);border-radius:14px;padding:10px;min-height:70px}
.lk-vacio,.lk-kosong{color:var(--lk-mut);font-size:13px;margin:8px 4px}
.lk-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--lk-card)}
.lk-row:last-child{border-bottom:0}
.lk-mini{width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#1b1b2f;flex:none;
  clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.lk-nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-step{display:flex;align-items:center;gap:4px}
.lk-step button{width:36px;height:36px;border:1.5px solid var(--lk-line);background:none;border-radius:8px;font-weight:800;font-size:16px}
.lk-step input{width:52px;height:36px;text-align:center;border:1.5px solid var(--lk-line);background:none;color:inherit;border-radius:8px;font:inherit;-moz-appearance:textfield}
.lk-step input::-webkit-inner-spin-button{display:none}
.lk-total{font-size:12px;color:var(--lk-mut);margin:6px 2px}
.lk-anim,.lk-spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:10px auto}
.lk-hasil{background:var(--lk-card);border-radius:16px;padding:14px;margin-top:12px}

.lk-rumus{font-size:18px;text-align:center;color:var(--lk-acc);font-weight:700}
.lk-rumus sub{font-size:.65em;color:#d9a600}
.lk-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:12px 0}
.lk-dl dt{color:var(--lk-mut)}.lk-dl dd{margin:0;font-weight:700}
.lk-desc{font-size:14px;line-height:1.55;margin:8px 0}
.lk-bahaya{border:1.5px solid #e03131;color:#c92a2a;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
html[data-theme="dark"] .lk-bahaya{color:#ff8787;border-color:#ff8787}
.lk-foot{font-size:11px;color:var(--lk-mut);text-align:center;margin-top:6px}
.lk-koleksi{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:8px}
.lk-kartu{background:var(--lk-card);border:1.5px solid transparent;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;min-height:44px}
.lk-kartu:focus-visible,.lk-btn:focus-visible,.lk-chip:focus-visible,.lk-tab:focus-visible{outline:2px solid var(--lk-acc);outline-offset:2px}
.lk-kartu canvas{image-rendering:pixelated;display:block;margin:0 auto 4px}
.lk-overlay{position:fixed;inset:0;background:rgba(10,10,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
.lk-modal{background:var(--lk-bg);color:var(--lk-fg);border-radius:18px;max-width:420px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:14px}
.lk-modal canvas.lk-kartu-img{width:100%;height:auto;display:block;border-radius:10px}
.lk-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--lk-fg);color:var(--lk-bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:10000;max-width:90vw}
.lk-mode{display:flex;border:1.5px solid var(--lk-line);border-radius:12px;overflow:hidden;margin:4px 0 10px}
.lk-mode button{flex:1;border:0;background:none;min-height:44px;font-weight:700;font-size:13px}
.lk-mode button[aria-pressed="true"]{background:var(--lk-fg);color:var(--lk-bg)}
.lk-skor{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700;margin:2px 2px 8px}
.lk-skor-b{color:#d9a600}.lk-skor-m{color:var(--lk-mut);font-weight:600}
.lk-soal{background:var(--lk-card);border:1.5px dashed var(--lk-line);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.lk-soal:empty{display:none}
.lk-soal-j{font-weight:800;font-size:15px}.lk-soal-p{font-size:13px;color:var(--lk-mut);margin:4px 0}
.lk-rumus-box{margin:12px 0 4px}.lk-rumus-box label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.lk-rumus-in{width:100%;border:1.5px solid var(--lk-line);border-radius:12px;min-height:48px;padding:0 12px;background:none;color:inherit;font:inherit;font-size:18px;font-weight:700;letter-spacing:.03em}
.lk-rumus-in:focus-visible{outline:2px solid var(--lk-acc);outline-offset:2px}
.lk-prev{min-height:26px;font-size:20px;font-weight:800;color:var(--lk-acc);margin:4px 2px}.lk-prev sub{font-size:.65em;color:#d9a600}
.lk-umpan{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.5;border:1.5px solid}
.lk-umpan p{margin:6px 0}.lk-umpan ul{margin:6px 0;padding-left:20px}
.lk-umpan.salah{background:#fff4e0;color:#5c3b00;border-color:#e8a020}.lk-umpan.tidak{background:#ffe9e9;color:#6b1a1a;border-color:#e03131}
html[data-theme="dark"] .lk-umpan.salah{background:#3a2c10;color:#ffe3a6}html[data-theme="dark"] .lk-umpan.tidak{background:#3a1a1a;color:#ffc9c9}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .lk-umpan.salah{background:#3a2c10;color:#ffe3a6}html:not([data-theme="light"]) .lk-umpan.tidak{background:#3a1a1a;color:#ffc9c9}}
.lk-umpan-j{font-weight:800;font-size:15px}.lk-tip{font-size:13px}
.lk-ok{background:#e3f9e5;color:#12351a;border:1.5px solid #2b8a3e;border-radius:12px;padding:8px 12px;margin-bottom:10px}
html[data-theme="dark"] .lk-ok{background:#143020;color:#c9f5d1}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .lk-ok{background:#143020;color:#c9f5d1}}
.lk-ok-j{font-weight:800;font-size:15px}.lk-ok-c{font-size:12px;margin-top:2px}
.lk-bintang{color:#e8a600;letter-spacing:2px}
.lk-pakai{background:var(--lk-bg);border:1.5px solid var(--lk-line);border-radius:12px;padding:8px 12px;margin:10px 0}
.lk-pakai h4{margin:0 0 4px;font-size:12px;color:var(--lk-mut);text-transform:uppercase;letter-spacing:.05em}.lk-pakai p{margin:0;font-size:14px;line-height:1.5}
